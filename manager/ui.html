<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>claude-share</title>
<style>
  :root {
    --bg: #f6f5f1; --surface: #ffffff; --text: #1d1c1a; --muted: #6d6a63;
    --border: #e3e0d8; --accent: #c2410c; --accent-text: #ffffff;
    --ok: #15803d; --warn: #b45309; --bad: #b91c1c; --code-bg: #f1efe9;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161513; --surface: #201f1c; --text: #ecebe7; --muted: #9c988e;
      --border: #34322d; --accent: #f97316; --accent-text: #1a0f06;
      --ok: #4ade80; --warn: #fbbf24; --bad: #f87171; --code-bg: #2a2925;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px 64px; }
  header { margin-bottom: 28px; }
  h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: -0.01em; }
  h2 { font-size: 16px; margin: 0 0 16px; }
  .sub { color: var(--muted); margin: 0; }
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 20px; margin-bottom: 16px;
  }
  label { display: block; font-weight: 600; font-size: 13px; margin: 14px 0 6px; }
  label:first-of-type { margin-top: 0; }
  .hint { color: var(--muted); font-size: 13px; font-weight: 400; margin: 4px 0 0; }
  input[type=text], input[type=password], select, textarea {
    width: 100%; padding: 9px 11px; font: inherit; color: var(--text);
    background: var(--bg); border: 1px solid var(--border); border-radius: 7px;
  }
  textarea { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; resize: vertical; min-height: 64px; }
  input:focus, select:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; }
  .row > * { flex: 1 1 200px; }
  .check { display: flex; gap: 10px; align-items: flex-start; font-weight: 400; font-size: 14px; margin-top: 14px; }
  .check input { margin-top: 4px; }
  .terms { font-size: 13px; color: var(--muted); background: var(--code-bg); border-radius: 7px; padding: 10px 12px; margin-top: 14px; }
  button {
    font: inherit; font-weight: 600; font-size: 14px; cursor: pointer;
    padding: 8px 14px; border-radius: 7px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text);
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  button.danger { color: var(--bad); }
  button:disabled { opacity: .5; cursor: default; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; align-items: center; }
  .error { color: var(--bad); font-size: 14px; }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; background: var(--code-bg); padding: 1px 5px; border-radius: 4px; }
  .inst-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .inst-head h3 { margin: 0; font-size: 16px; }
  .meta { color: var(--muted); font-size: 13px; }
  .badge { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 99px; border: 1px solid currentColor; }
  .s-running { color: var(--ok); } .s-starting { color: var(--warn); }
  .s-restarting { color: var(--warn); } .s-failed { color: var(--bad); }
  .state { font-size: 12px; font-weight: 600; }
  .state.on { color: var(--ok); } .state.off { color: var(--muted); }
  .s-stopped { color: var(--muted); } .s-expired { color: var(--bad); }
  button.small { padding: 2px 8px; font-size: 12px; margin-left: auto; }
  .link { display: flex; gap: 8px; margin-top: 8px; align-items: center; }
  .link span { font-size: 12px; color: var(--muted); width: 48px; flex: none; }
  .link input { flex: 1; min-width: 0; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
  ul.machines { list-style: none; padding: 0; margin: 8px 0 0; }
  ul.machines li { display: flex; gap: 8px; align-items: center; font-size: 14px; padding: 3px 0; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .note { font-size: 13px; color: var(--muted); margin-top: 12px; }
  .empty { color: var(--muted); }
</style>
</head>
<body>
<main>
  <header>
    <h1 id="title">claude-share</h1>
    <p class="sub">Pair a device with the Claude subscription shared from this server.</p>
  </header>

  <section class="card" id="login" hidden>
    <h2>Manager password</h2>
    <form id="login-form" autocomplete="on">
      <input id="password" type="password" autocomplete="current-password" required>
      <div class="actions">
        <button class="primary" type="submit">Unlock</button>
        <span class="error" id="login-error" role="alert"></span>
      </div>
    </form>
  </section>

  <div id="share"></div>
</main>

<script>
(() => {
  const PW_STORE = "claude-share-manager-password";
  const $ = (id) => document.getElementById(id);

  // The password is remembered in this browser only as a convenience
  let password = "";
  try { password = localStorage.getItem(PW_STORE) || ""; } catch {}
  let passwordRequired = false;
  let locked = false;
  let latest = null;

  function el(tag, attrs = {}, ...children) {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (v == null || v === false) continue;
      if (k === "class") n.className = v;
      else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
      else if (v !== false && v != null) n.setAttribute(k, v === true ? "" : v);
    }
    for (const c of children.flat()) if (c != null) n.append(c);
    return n;
  }

  function remaining(iso) {
    if (!iso) return "";
    const ms = new Date(iso).getTime() - Date.now();
    if (ms <= 0) return "now";
    const h = Math.floor(ms / 3600000), m = Math.floor((ms % 3600000) / 60000);
    if (h >= 48) return `${Math.floor(h / 24)}d ${h % 24}h`;
    if (h > 0) return `${h}h ${m}m`;
    if (m > 0) return `${m}m`;
    return `${Math.ceil(ms / 1000)}s`;
  }
  function ago(iso) {
    const s = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
    if (s < 10) return "just now";
    if (s < 60) return `${s}s ago`;
    if (s < 3600) return `${Math.floor(s / 60)}m ago`;
    if (s < 172800) return `${Math.floor(s / 3600)}h ago`;
    return `${Math.floor(s / 86400)}d ago`;
  }

  async function copy(text, btn) {
    let ok = false;
    try { await navigator.clipboard.writeText(text); ok = true; } catch {
      // Clipboard API needs HTTPS; fall back for plain-HTTP deployments
      const ta = el("textarea", { style: "position:fixed;opacity:0" }); ta.value = text;
      document.body.append(ta); ta.select();
      try { ok = document.execCommand("copy"); } catch {}
      ta.remove();
    }
    const prev = btn.textContent;
    btn.textContent = ok ? "Copied" : "Select & copy manually";
    setTimeout(() => (btn.textContent = prev), 1500);
  }

  async function api(method, url) {
    const headers = {};
    if (password) headers["x-manager-password"] = password;
    const res = await fetch(url, { method, headers });
    const data = await res.json().catch(() => ({}));
    return { res, data };
  }

  function linkRow(label, url) {
    const input = el("input", { type: "text", readonly: true, value: url, onfocus: (e) => e.target.select() });
    const btn = el("button", { type: "button", onclick: () => copy(url, btn) }, "Copy");
    return el("div", { class: "link" }, el("span", {}, label), input, btn);
  }

  function render() {
    const root = $("share");
    root.replaceChildren();
    $("login").hidden = !locked;
    if (locked || !latest) return;
    const d = latest;
    $("title").textContent = d.name;
    document.title = `${d.name} · claude-share`;

    const card = el("section", { class: "card" });
    const meta = [`port ${d.port}`, `token valid for ${remaining(d.tokenExpiresAt)}`];
    card.append(el("div", { class: "inst-head" },
      el("div", {}, el("h3", {}, "Share"), el("div", { class: "meta" }, meta.join(" · "))),
      el("span", { class: `badge s-${d.state}` }, d.state),
    ));

    if (d.error && d.state !== "running") card.append(el("p", { class: "error" }, d.error));
    if (d.state === "stopped") card.append(el("p", { class: "note" }, "The share is stopped. Starting it again creates a new session, so every device has to pair again."));
    if (d.restartAt && d.state !== "running") card.append(el("p", { class: "note" }, `Restarting in ${remaining(d.restartAt)}…`));
    if (d.tunnelDown) card.append(el("p", { class: "error" }, "The internet tunnel disconnected — only the direct link works."));
    if (d.state !== "expired" && new Date(d.tokenExpiresAt).getTime() - Date.now() < 7 * 24 * 3600000) {
      card.append(el("p", { class: "error" }, `The server's Claude token expires in ${remaining(d.tokenExpiresAt)} — set a new CLAUDE_TOKEN before then.`));
    }

    const actions = el("div", { class: "actions" });
    if (d.state === "running") {
      if (d.connect.lan || d.connect.public) {
        card.append(el("p", { class: "note" }, "One-time link — the first device that uses it is paired. On that device, run:"));
        card.append(el("p", {}, el("code", {}, "claude-connect --share <link>")));
        if (d.connect.lan) card.append(linkRow("Direct", d.connect.lan));
        if (d.connect.public) card.append(linkRow("Tunnel", d.connect.public));
        if (d.tunnel && !d.connect.public) card.append(el("p", { class: "note" }, "Tunnel is not available."));
      } else {
        card.append(el("p", { class: "note" }, "The last pairing link has been used. Create a new one to pair another device."));
      }
      actions.append(el("button", {
        type: "button",
        class: d.pairingCodeUsed ? "primary" : null,
        onclick: () => act("regenerate"),
      }, "New pairing link"));
    } else if (d.state === "starting" || d.state === "restarting") {
      card.append(el("p", { class: "note" }, "Starting up…"));
    }
    if (d.state === "stopped") {
      actions.append(el("button", { type: "button", class: "primary", onclick: () => act("start") }, "Start share"));
    } else if (d.state === "failed") {
      actions.append(el("button", { type: "button", onclick: () => act("start") }, "Retry now"));
      actions.append(confirmButton("stop", "Stop share", "Click again to stop", () => act("stop")));
    } else if (d.state !== "expired") {
      actions.append(confirmButton("stop", "Stop share", "Click again — all devices are unpaired", () => act("stop")));
    }
    card.append(actions);
    root.append(card);

    const devices = el("section", { class: "card" });
    devices.append(el("h2", {}, `Paired devices (${d.machines.length})`));
    if (!d.machines.length) {
      devices.append(el("p", { class: "empty" }, d.state === "running" ? "No devices paired yet." : "Shown once the share is running."));
    } else {
      const sorted = [...d.machines].sort((a, b) => (b.active - a.active) || (new Date(b.lastActiveAt) - new Date(a.lastActiveAt)));
      devices.append(el("ul", { class: "machines" }, sorted.map((m) =>
        el("li", {},
          el("span", { class: "dot", style: `background:var(${m.active ? "--ok" : "--muted"})` }),
          el("span", {}, m.name),
          el("span", { class: `state ${m.active ? "on" : "off"}` }, m.active ? "connected" : "disconnected"),
          el("span", { class: "meta" }, m.active
            ? `· ${m.sessions} session${m.sessions === 1 ? "" : "s"}`
            : `· last seen ${ago(m.lastActiveAt)}`),
          confirmButton(`rm:${m.id}`, "Remove", "Click again to remove", () =>
            act(`machines/${encodeURIComponent(m.id)}/remove`), "small danger"),
        ),
      )));
    }
    devices.append(el("p", { class: "note" }, "Devices stay paired until you remove them or the server's token expires. Stopping the share or restarting the server starts a new session, and every device has to pair again."));
    root.append(devices);
  }

  // Inline two-step confirm instead of a blocking dialog
  let armed = null; // { key, at }
  const isArmed = () => armed && Date.now() - armed.at < 4000;
  function confirmButton(key, label, confirmLabel, onConfirm, cls = "danger") {
    const live = isArmed() && armed.key === key;
    const btn = el("button", { type: "button", class: cls }, live ? confirmLabel : label);
    btn.addEventListener("click", () => {
      if (isArmed() && armed.key === key) {
        armed = null;
        onConfirm();
        return;
      }
      armed = { key, at: Date.now() };
      render();
      setTimeout(() => { if (armed && armed.key === key && !isArmed()) { armed = null; render(); } }, 4100);
    });
    return btn;
  }

  async function refresh() {
    if (locked) return;
    try {
      const { res, data } = await api("GET", "/api/share");
      if (res.status === 401) {
        locked = true;
        if (password) $("login-error").textContent = "Wrong password.";
      } else if (res.status === 429) {
        locked = true;
        $("login-error").textContent = data.error;
      } else if (res.ok) {
        latest = data;
      }
    } catch {}
    // Keep focus/selection stable while the user is selecting a link
    const active = document.activeElement;
    if (!locked && active && active.closest && active.closest("#share") && active.tagName === "INPUT") return;
    if (isArmed()) return;
    render();
  }

  async function act(action) {
    await api("POST", `/api/share/${action}`);
    setTimeout(refresh, 400);
  }

  $("login-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    password = $("password").value;
    $("login-error").textContent = "";
    try { localStorage.setItem(PW_STORE, password); } catch {}
    locked = false;
    await refresh();
  });

  (async () => {
    try {
      passwordRequired = (await (await fetch("/api/config")).json()).passwordRequired;
    } catch {}
    locked = passwordRequired && !password;
    render();
    await refresh();
    setInterval(refresh, 2000);
  })();
})();
</script>
</body>
</html>
