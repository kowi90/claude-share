services:
  claude-share:
    build:
      context: .
      args:
        # Only needed for the optional internet tunnel (baked in at build time)
        BORE_SERVER: ${BORE_SERVER:-bore.pub}
        BORE_PASSWORD: ${BORE_PASSWORD:-}
    image: claude-share-manager
    restart: unless-stopped
    init: true
    environment:
      # The IP or hostname receivers use to reach this server. Put into connect
      # links and the TLS certificate, so it must be exactly what they connect to.
      ADVERTISE_HOST: ${ADVERTISE_HOST:?set ADVERTISE_HOST to this server's IP or hostname}
      # The Claude subscription to share: the output of `claude setup-token`.
      # Handed to the share process over IPC only, never written to disk.
      CLAUDE_TOKEN: ${CLAUDE_TOKEN:?set CLAUDE_TOKEN to the output of claude setup-token}
      # Shown to receivers and as the page title
      SHARE_NAME: ${SHARE_NAME:-claude-share}
      # Required to open the web page (which shows pairing links). Leave empty
      # only on a fully trusted network.
      MANAGER_PASSWORD: ${MANAGER_PASSWORD:-}
      # Set to 1 to also expose the share over the internet via bore
      TUNNEL: ${TUNNEL:-0}
      SHARE_PORT: 2586
      # Days of old log files kept besides today's (0 = today only)
      CLAUDE_SHARE_LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-1}
    volumes:
      # Daily log files from the manager and every share instance. The
      # directory must be writable by uid 1000 (the container's "node" user):
      #   mkdir -p logs && sudo chown 1000:1000 logs
      - ${LOG_HOST_DIR:-./logs}:/var/log/claude-share
    ports:
      - "${MANAGER_HOST_PORT:-8080}:8080"   # web interface
      - "2586:2586"                        # the share (host port must equal container port)
